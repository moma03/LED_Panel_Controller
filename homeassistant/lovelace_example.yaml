# Example Lovelace dashboard card for the LED Display Controller entities.
# Paste into a dashboard view (Settings > Dashboards > Edit > Raw configuration editor),
# or add as a card in the UI editor by pointing it at these entity ids.

type: vertical-stack
cards:
  - type: entities
    title: LED Display
    entities:
      - entity: sensor.led_display_status
        name: Status
      - entity: sensor.led_display_current_program
        name: Current Program
      - entity: sensor.led_display_current_subprogram
        name: Current Subprogram
      - entity: sensor.led_display_last_error
        name: Last Error

  - type: entities
    title: Select Program
    entities:
      - entity: select.led_display_program
        name: Program
      - entity: select.led_display_subprogram
        name: Subprogram (Train Board only)

  # Each program with controls is its own HA device. Show its card only while
  # it is the program on the panel: the current-program sensor holds the
  # program id from the controller's config.yaml. The entity ids below are the
  # ones the manifests suggest; HA keeps whatever ids existing entities already
  # have (matched by unique_id), so check the device page and adjust.
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.led_display_controller_current_program
        state: hvv_display
    card:
      type: entities
      title: HVV U-Bahn
      entities:
        - select.hvv_display_favorite
        - text.hvv_display_station
        - select.hvv_display_display
        - select.hvv_display_panel
        - select.hvv_display_time_format
        - select.hvv_display_transport
        - text.hvv_display_line_filter
        - text.hvv_display_direction_filter
        - switch.hvv_display_announcements
        - sensor.hvv_display_next_departure
        - button.hvv_display_refresh

  - type: conditional
    conditions:
      - condition: state
        entity: sensor.led_display_controller_current_program
        state: db_display
    card:
      type: entities
      title: Bahn-Abfahrten
      entities:
        - text.db_display_station
        - sensor.db_display_station_name
        - sensor.db_display_status

  - type: horizontal-stack
    cards:
      - type: button
        entity: button.led_display_power_on
        name: Power On
        icon: mdi:power
      - type: button
        entity: button.led_display_start_program
        name: Start
        icon: mdi:play

  - type: horizontal-stack
    cards:
      - type: button
        entity: button.led_display_stop
        name: Stop
        icon: mdi:stop
      - type: button
        entity: button.led_display_reset
        name: Reset
        icon: mdi:restart
      - type: button
        entity: button.led_display_shutdown
        name: Shutdown
        icon: mdi:power-off

  # Force-restarts the whole controller process/service, independent of whether it's
  # currently responding -- see ../deploy/README.md. Kept as its own card, away from
  # the normal controls above, with a confirmation prompt since it's disruptive.
  - type: button
    entity: button.led_display_emergency_restart
    name: Emergency Restart
    icon: mdi:restart-alert
    confirmation:
      text: Force-restart the LED controller process?
